<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TangoQuest self-tests</title>
<style>
body{font-family:Consolas,monospace; background:#12141f; color:#e9ecf8; padding:16px; font-size:13px}
.ok{color:#4ade80} .ng{color:#f87171} h1{font-size:16px}
#sum{font-weight:bold; font-size:15px; margin:10px 0}
iframe{width:1px; height:1px; opacity:0}
</style>
</head>
<body>
<h1>TangoQuest self-tests</h1>
<div id="sum">running...</div>
<div id="list"></div>
<iframe id="app" src="../index.html"></iframe>
<script>
"use strict";
/* 本番URLで誤って開いてlocalStorageを壊さないためのガード */
if(location.hostname!=="localhost" && location.hostname!=="127.0.0.1"){
  document.body.innerHTML="<p>localhost専用</p>";
  throw new Error("guard");
}
const results=[];
function t(name, fn){
  try{ fn(); results.push([name, true, ""]); }
  catch(e){ results.push([name, false, String(e.message||e)]); }
}
function eq(a,b,msg){ if(a!==b) throw new Error((msg||"")+" expected="+b+" got="+a); }
function ok(v,msg){ if(!v) throw new Error(msg||"falsy"); }

localStorage.removeItem("tangoquest_v1"); // 毎回まっさらな状態で起動させる

const frame=document.getElementById("app");
frame.onload=()=>setTimeout(run, 300);

/* ヘッドレス実行(--virtual-time-budget)対策: 非同期テスト(Cache API等)の完了を
   待つ間、短い間隔のタイマーを回して仮想時間の進みを実時間に橋渡しする。
   これがないとアプリ側のsetInterval(5秒)が仮想時間の予算を先に使い切り、
   report()前のDOMがダンプされてしまう。report()で止める */
const keepalive=setInterval(()=>{}, 25);

function run(){
  const W=frame.contentWindow;
  try{

  /* ---- データ ---- */
  t("WORDSが800語以上", ()=>ok(W.WORDS.length>=800, "len="+W.WORDS.length));
  t("全単語にpos(v/n/adj/adv)がある", ()=>{
    const okPos=new Set(["v","n","adj","adv"]);
    W.WORDS.forEach(w=>ok(okPos.has(w.pos), w.en));
  });

  /* ---- カード生成 ---- */
  t("カード生成は決定的", ()=>{
    const a=W.cardOf("abate|3|2"), b=W.cardOf("abate|3|2");
    eq(JSON.stringify(a), JSON.stringify(b));
  });
  t("品詞→役割のマッピング(v3文法)", ()=>{
    const find=p=>W.WORDS.find(w=>w.pos===p);
    ok(W.genCard(find("n"),1,0).val>0, "noun val");
    const a=W.genCard(find("adj"),1,0); ok((a.m>1)||(a.p>1), "adj m/p");
    const d=W.genCard(find("adv"),1,0); ok(d.sub>=0&&d.sub<3, "adv sub");
    const v=W.genCard(find("v"),1,0); ok(v.w>=1&&v.vt>=0, "verb");
  });
  t("レア度・Lvで性能が伸び、長い単語ほど基礎値が大きい", ()=>{
    const w=W.WORDS.find(x=>x.pos==="n");
    ok(W.genCard(w,5,0).val > W.genCard(w,1,0).val, "rar");
    ok(W.genCard(w,1,3).val > W.genCard(w,1,0).val, "lv");
    const sh=W.WORDS.find(x=>x.pos==="n"&&x.en.length<=4);
    const lo=W.WORDS.find(x=>x.pos==="n"&&x.en.length>=10);
    ok(sh&&lo, "sample");
    ok(W.genCard(lo,1,0).val > W.genCard(sh,1,0).val, "len");
  });
  t("ドロップレア度: 新規=★1〜2 / 連続ミス10=★5", ()=>{
    for(let i=0;i<50;i++){
      const r=W.dropRarity(null); ok(r>=1&&r<=2, "new r="+r);
      const r2=W.dropRarity([0,0,0,10,0,10,0]); eq(r2,5,"ws10");
    }
  });

  /* ---- 在庫・重ね(v4.0.0: 合成廃止・重ねるだけでLvが上がる) ---- */
  t("同じカードを重ねるとLvが上がる(2枚=+1・上限なし)", ()=>{
    const G=W.G;
    const en=W.WORDS[0].en, k=en+"|1|0";
    delete G.inv[k];
    W.addCard(en,1);
    eq(W.cardOf(k).lv, 0, "1枚=Lv0");
    W.addCard(en,1);
    eq(W.cardOf(k).lv, 1, "2枚=+1");
    for(let i=0;i<13;i++) W.addCard(en,1);
    eq(W.cardOf(k).lv, 14, "15枚=+14(上限なし)");
    delete G.inv[k];
  });
  t("重ねるほどカードは強くなる(+10以降も伸び続ける)", ()=>{
    const w=W.WORDS.find(x=>x.pos==="n");
    const v0=W.genCard(w,1,0).val, v10=W.genCard(w,1,10).val, v20=W.genCard(w,1,20).val;
    ok(v10>v0, "+10で強化");
    ok(v20>v10, "+10以降も伸びる");
    ok(v20-v10 < v10-v0, "伸びは緩やかになる");
  });
  t("旧「+Lv」在庫は枚数(2^lv)に換算して移行される", ()=>{
    const g={inv:{"foo|2|2":1, "foo|2|0":3, "bar|1|1":2},
             party:{sentence:["foo|2|2", "bar|1|1", "foo|2|0", null]}};
    W.migrateInvToStacks(g);
    eq(g.inv["foo|2|0"], 7, "1×4+3=7枚");
    eq(g.inv["bar|1|0"], 4, "2×2=4枚");
    ok(!g.inv["foo|2|2"] && !g.inv["bar|1|1"], "旧キーは消える");
    eq(g.party.sentence[0], "foo|2|0", "文のキーも基本形へ");
    eq(g.party.sentence[1], "bar|1|0");
    eq(g.party.sentence[2], null, "同一カードの重複配置は解消");
    W.migrateInvToStacks(g);
    eq(g.inv["foo|2|0"], 7, "再実行しても変わらない(冪等)");
  });
  t("2枚目からは「重ね」として任務に計上される", ()=>{
    const G=W.G;
    const en=W.WORDS[10].en, k=en+"|2|0";
    delete G.inv[k];
    const m0=G.counters.merges;
    W.addCard(en,2);
    eq(G.counters.merges, m0, "1枚目は重ねではない");
    W.addCard(en,2);
    eq(G.counters.merges, m0+1, "2枚目=重ね1回");
    delete G.inv[k];
  });

  /* ---- 戦闘 ---- */
  t("強者は勝ち弱者は負ける(v2スナップショット互換も含む)", ()=>{
    // atkのみのv2形式スナップショットでも動く(無限回廊の旧セーブ互換)
    const strong={name:"S",hp:1000,atk:500,def:100,spd:20};
    const weak={name:"W",hp:100,atk:5,def:0,spd:5};
    ok(W.simBattle(strong, Object.assign({},weak)).win, "strong wins");
    ok(!W.simBattle(Object.assign({},weak,{name:"W2"}), Object.assign({},strong)).win, "weak loses");
  });
  t("敵はtier/floorで強くなる", ()=>{
    const e1=W.enemyFor(1,1,5,false,["a"],"b");
    const e2=W.enemyFor(2,1,5,false,["a"],"b");
    const e3=W.enemyFor(1,4,5,false,["a"],"b");
    ok(e2.hp>e1.hp, "tier"); ok(e3.hp>e1.hp, "floor");
  });
  t("文に名詞を置くとダメージ/ターンと戦闘力が上がる", ()=>{
    const G=W.G;
    G.party.sentence=[];
    const p0=W.playerStats();
    const w=W.WORDS.filter(x=>x.pos==="n")[2];
    W.addCard(w.en,3);
    G.party.sentence=[w.en+"|3|0"];
    const p1=W.playerStats();
    ok(p1.dpt>p0.dpt, "dpt");
    ok(p1.power>p0.power, "power");
  });

  /* ---- 任務・計上 ---- */
  t("track()がデイリー/ウィークリー/累計を計上する", ()=>{
    const G=W.G;
    const before=G.counters.cor;
    const d0=W.dailyRec().c;
    W.track("cor");
    eq(G.counters.cor, before+1);
    eq(W.dailyRec().c, d0+1);
  });
  t("正解10問でデイリー任務が受取可能になる", ()=>{
    const d=W.dailyRec();
    d.c=10; d.cl={};
    ok(W.hasClaimable(), "claimable");
  });

  /* ---- かけら(レガシー)・分解廃止(v4.13.0) ---- */
  t("分解機能は廃止: 分解UI・関数がなく、レガシーかけらだけ使える", ()=>{
    const G=W.G;
    ok(!W.document.getElementById("bulkDisBtn"), "一括分解ボタンは撤去");
    eq(typeof W.disassemble, "undefined", "disassemble関数は撤去");
    eq(typeof W.bulkDisassemble, "undefined", "bulkDisassemble関数は撤去");
    const en=W.WORDS[20].en;
    W.addCard(en,3);
    const s0=G.shards;
    G.shards=0;
    W.openCardModal(en+"|3|0");
    ok(!W.document.getElementById("disBtn"), "カード詳細に分解ボタンがない");
    ok(!W.document.getElementById("enhBtn"), "かけら0なら重ねるボタンも出ない");
    W.closeModal();
    G.shards=100;
    W.openCardModal(en+"|3|0");
    ok(W.document.getElementById("enhBtn"), "かけらが残っていれば重ねるボタンが出る");
    W.closeModal();
    G.shards=s0;
    delete G.inv[en+"|3|0"];
  });
  t("かけらで「重ねる」: 同キーの枚数が増えかけらが減る", ()=>{
    const G=W.G;
    const en=W.WORDS[21].en, k=en+"|1|0";
    delete G.inv[k];
    W.addCard(en,1);
    G.shards=100;
    const nk=W.enhanceOne(k);
    eq(nk, k, "キーは変わらない");
    eq(G.inv[k], 2, "2枚=Lv+1");
    eq(G.shards, 98, "cost=★1のLv0は2");
    const c=W.cardOf(k);
    eq(c.lv, 1, "Lv+1");
    ok(W.enhCost(c)>2, "重ねるほど次の1枚が高くつく");
    delete G.inv[k];
  });
  t("同じカードは文に1枠しか置けない", ()=>{
    const G=W.G;
    const oldInv=G.inv, oldSent=G.party.sentence;
    const w=W.WORDS.filter(x=>x.pos==="n")[6];
    G.inv={};
    W.addCard(w.en,1); W.addCard(w.en,1); W.addCard(w.en,1);
    G.party.sentence=[null,null,null,null];
    eq(W.quickEquip(w.en+"|1|0"), 1, "1回目は置ける");
    eq(W.quickEquip(w.en+"|1|0"), null, "2枠目は置けない");
    G.inv=oldInv; G.party.sentence=oldSent;
  });

  /* ---- v4.8.0: 単語=1カード(レア=最高到達・Lv=全レア合計) ---- */
  t("同単語の別レア入手は1枚のカードに合流(レア=最高・Lv=合計枚数-1)", ()=>{
    const G=W.G;
    const en=W.WORDS[120].en;
    for(let r=1;r<=5;r++) delete G.inv[en+"|"+r+"|0"];
    W.addCard(en,1); W.addCard(en,1); W.addCard(en,1);
    const d=W.addCard(en,3);
    ok(d.rarUp, "所持中の単語を高レアで引くと★アップ");
    eq(d.rar, 3);
    eq(W.canonKeyOf(en), en+"|3|0", "正規キー=最高レア");
    const c=W.cardOf(W.canonKeyOf(en));
    eq(c.rar, 3, "レア=最高到達");
    eq(c.lv, 3, "Lv=合計4枚-1(別レアの枚数も合流)");
    const d2=W.addCard(en,1);
    ok(!d2.rarUp, "低レアでは★は動かない");
    eq(W.cardOf(W.canonKeyOf(en)).lv, 4, "低レアの1枚もLvになる");
    for(let r=1;r<=5;r++) delete G.inv[en+"|"+r+"|0"];
  });
  t("配置中の単語が★アップすると文のキーも差し替わる", ()=>{
    const G=W.G, oldSent=G.party.sentence;
    const en=W.WORDS[121].en;
    for(let r=1;r<=5;r++) delete G.inv[en+"|"+r+"|0"];
    W.addCard(en,1);
    G.party.sentence=[en+"|1|0", null];
    W.addCard(en,4);
    eq(G.party.sentence[0], en+"|4|0", "★4のキーへ差し替え");
    for(let r=1;r<=5;r++) delete G.inv[en+"|"+r+"|0"];
    G.party.sentence=oldSent;
  });
  t("同じ単語は別レアのキーでも文に1枠だけ(自己共鳴の穴を塞ぐ)", ()=>{
    const G=W.G, oldInv=G.inv, oldSent=G.party.sentence;
    const w=W.WORDS.filter(x=>x.pos==="n")[8];
    G.inv={};
    W.addCard(w.en,1); W.addCard(w.en,3);
    G.party.sentence=[null,null,null,null];
    eq(W.quickEquip(w.en+"|3|0"), 1, "1回目は置ける");
    eq(W.quickEquip(w.en+"|1|0"), null, "別レアのキーでも同単語は置けない");
    eq(W.equippedCountOf(w.en+"|1|0"), 1, "配置判定は単語単位");
    G.inv=oldInv; G.party.sentence=oldSent;
  });
  t("起動時整合: 文のキーは最高レアへ寄り、同単語の重複配置は解消(冪等)", ()=>{
    const a=W.WORDS[122].en, b=W.WORDS[123].en;
    const g={inv:{}, party:{sentence:[a+"|1|0", b+"|2|0", a+"|3|0", null]}};
    g.inv[a+"|1|0"]=2; g.inv[a+"|3|0"]=1; g.inv[b+"|2|0"]=1;
    W.normalizeSentenceRarity(g);
    eq(g.party.sentence[0], a+"|3|0", "最高レアの正規キーへ");
    eq(g.party.sentence[1], b+"|2|0", "正規ならそのまま");
    eq(g.party.sentence[2], null, "同単語の重複配置(旧仕様の穴)は解消");
    const snap=JSON.stringify(g.party.sentence);
    W.normalizeSentenceRarity(g);
    eq(JSON.stringify(g.party.sentence), snap, "冪等");
    const g2={inv:{}, party:{sentence:[a+"|1|0"]}};
    W.normalizeSentenceRarity(g2);
    eq(g2.party.sentence[0], null, "未所持の単語は文から外れる");
  });
  /* ---- 属性・セット効果 ---- */
  t("属性は決定的(レア・Lvで不変)で0〜4", ()=>{
    const a=W.genCard(W.WORDS[0],1,0), b=W.genCard(W.WORDS[0],3,2);
    ok(a.elem>=0 && a.elem<5, "range");
    eq(a.elem, b.elem, "stable");
  });
  t("同属性2枚でセット効果(ダメージ×1.05)が発動する", ()=>{
    const cards=W.WORDS.filter(x=>x.pos==="n").map(x=>W.genCard(x,1,0));
    const a=cards[0];
    const b=cards.find(c=>c.en!==a.en && c.elem===a.elem);
    ok(b, "同属性ペアが存在");
    const P=W.playerStats([a.key, b.key]);
    ok(P.sets && P.sets.length===1, "set reported");
    eq(P.sets[0].n, 2, "count=2");
    eq(P.sets[0].b, 0.05, "+5%");
    ok(Math.abs(P.setM-1.05)<1e-9, "setM");
  });

  /* ---- 発動タイプ・属性相性・敵の特性 ---- */
  t("動詞カードに発動タイプ(0〜3)が決定的に付く", ()=>{
    const v=W.WORDS.find(w=>w.pos==="v");
    const a=W.genCard(v,1,0), b=W.genCard(v,4,3);
    ok(a.vt>=0 && a.vt<4, "range");
    eq(a.vt, b.vt, "レア・Lvで不変");
  });
  t("発動タイプは4種すべて存在する", ()=>{
    const types=new Set(W.WORDS.filter(w=>w.pos==="v").map(w=>W.genCard(w,1,0).vt));
    eq(types.size, 4, "found="+[...types].join(","));
  });
  t("属性相性: 有利カードで与ダメ増・被ダメ減", ()=>{
    const m=W.elemMatch([0,0,3,0,0], 1); // 風3枚 vs 水属性の敵(風は水に強い)
    eq(m.adv, 3, "adv");
    ok(Math.abs(m.dealt-1.21)<1e-9, "dealt="+m.dealt);
    ok(Math.abs(m.taken-0.88)<1e-9, "taken="+m.taken);
    const n=W.elemMatch([0,0,3,0,0], null);
    eq(n.dealt, 1, "属性なしは等倍");
  });
  t("貫通は高防御の敵に有効", ()=>{
    const E=()=>({name:"e",hp:2000,atk:1,def:900,spd:1});
    const P=vt=>({name:"p",hp:500,def:0,spd:10,charM:1,setM:1,amp:1,guard:0,
                  clauses:[{V:300,vt,w:1,name:"x",words:[]}]});
    ok(W.simBattle(P(1),E()).win, "貫通は倒せる");
    ok(!W.simBattle(P(0),E()).win, "強撃は防御に阻まれる");
  });
  t("吸収は回復する", ()=>{
    const r=W.simBattle({name:"p",hp:1000,def:0,spd:10,charM:1,setM:1,amp:1,guard:0,
      clauses:[{V:250,vt:2,w:1,name:"d",words:[]}]},
      {name:"e",hp:5000,atk:50,def:0,spd:1});
    ok(r.log.some(e=>e.heal>0), "healログ");
  });
  t("v4.6.0バランス: 敵HPは厚く・攻撃の伸びは緩やか(一撃必殺の是正)", ()=>{
    const e=(t,f)=>W.enemyFor(t,f,16,false,["a"],"b");
    // 攻撃はプレイヤー耐久に併走する緩い曲線(旧1.55^tierなら×121になっていた)
    const aRatio=e(12,1).atk/e(1,1).atk;
    ok(aRatio<8, "t12/t1の攻撃比が緩い: "+aRatio.toFixed(1));
    const hRatio=e(12,1).hp/e(1,1).hp;
    ok(hRatio>200, "HPは火力に併走して大きく伸びる: "+hRatio.toFixed(0));
    // 低tierは従来の手応え(HP倍率は控えめ)・高tierほど厚い
    ok(e(1,1).hp<200, "t1のHPは従来並み: "+e(1,1).hp);
    // 推奨戦闘力どおりなら数ターンで倒せる目安: 敵HP ≦ 推奨戦闘力(≒dpt×4.3)
    const d12=W.DUNGEONS[11];
    const boss=W.enemyFor(12, d12.floors, d12.floors, true, ["a"], "B");
    ok(boss.hp<W.recPower(d12)*3, "ボスHPが推奨戦闘力比で過大でない");
  });
  t("v4.6.0バランス: 戦闘中の回復は1ターン最大HP25%まで", ()=>{
    const P={name:"p", hp:1000, def:0, spd:99, charM:1, setM:1, amp:1, guard:0, abVamp:1.0,
             clauses:[{V:5000,vt:0,w:1,name:"x",words:[]},{V:5000,vt:2,w:1,name:"y",words:[]}]};
    const r=W.simBattle(P, {name:"e", hp:999999, atk:400, def:0, spd:1});
    const turns={};
    let turn=0;
    r.log.forEach(ev=>{
      if(ev.side==="e"){ turn++; return; }
      if(ev.heal) turns[turn]=(turns[turn]||0)+ev.heal;
    });
    const healsPerTurn=Object.values(turns);
    ok(healsPerTurn.length>0, "回復が発生している");
    healsPerTurn.forEach(h=>ok(h<=250, "1ターンの回復が上限超え: "+h));
  });
  t("敵の特性: toughは防御が上がりswiftは速くなる", ()=>{
    const base=W.enemyFor(3,1,5,false,["a"],"b");
    const tough=W.enemyFor(3,1,5,false,["a"],"b",{trait:"tough"});
    const swift=W.enemyFor(3,1,5,false,["a"],"b",{trait:"swift"});
    ok(tough.def>base.def*2, "tough def");
    ok(swift.spd>base.spd, "swift spd");
    eq(W.enemyFor(3,1,5,false,["a"],"b",{elem:2}).elem, 2, "elem引き継ぎ");
  });

  /* ---- 呪文文法(v3.0.0) ---- */
  t("文評価: 形容詞は直後の名詞に係る", ()=>{
    const adjM=W.WORDS.filter(x=>x.pos==="adj").map(x=>W.genCard(x,1,0)).find(c=>c.sub===0);
    const noun=W.genCard(W.WORDS.find(x=>x.pos==="n"),1,0);
    const ev=W.evalSentence([adjM.key, noun.key]);
    eq(ev.clauses.length, 1, "節1つ");
    eq(ev.clauses[0].V, Math.round(noun.val*adjM.m), "×m適用");
  });
  t("文評価: 乗算と累乗の並び順で結果が変わる(名詞に近い方から適用)", ()=>{
    const adjs=W.WORDS.filter(x=>x.pos==="adj").map(x=>W.genCard(x,4,0));
    const m=adjs.find(c=>c.sub===0), p=adjs.find(c=>c.sub===1);
    const n=W.genCard(W.WORDS.filter(x=>x.pos==="n")[3],4,0);
    const a=W.evalSentence([m.key, p.key, n.key]).clauses[0].V; // (v^p)×m
    const b=W.evalSentence([p.key, m.key, n.key]).clauses[0].V; // (v×m)^p
    eq(a, Math.round(Math.pow(n.val,p.p)*m.m), "近い方から適用");
    ok(Math.abs(a-b)>=2, "並び順で差が出る a="+a+" b="+b);
  });

    G.words[wild.en]=[3, Date.now()+864e5, 3,0,0,0,0]; // 復習済み

    if(oldSt) G.words[wild.en]=oldSt; else delete G.words[wild.en];
    if(oldInv) G.inv[wild.en+"|1|0"]=oldInv; else delete G.inv[wild.en+"|1|0"];
  });
  t("防衛線: ウェーブの合間に現在の編成が反映される(tdResnap)", ()=>{
    const G=W.G, s0=G.party.sentence;
    W.TD=W.tdNewBattle(W.DUNGEONS[0], {hp:100, dpt:10, catk:10, elems:[]});

    const n=W.WORDS.filter(x=>x.pos==="n")[12];

  });
  /* ---- v4.16.0: なかま出撃方式 ---- */
  t("防衛線: 💠言霊は正解で+100(コンボで増加)・ミスで+30", ()=>{
    eq(W.tdManaGain(true, 0), 100);
    eq(W.tdManaGain(true, 1), 100, "コンボ1はボーナスなし");
    eq(W.tdManaGain(true, 3), 120, "コンボ3で+20");
    eq(W.tdManaGain(true, 99), 150, "コンボボーナスは+50が上限");
    eq(W.tdManaGain(false, 5), 30, "ミスでも少し貯まる");
  });
  t("防衛線: なかまはレア度コストで出撃し、スキルが折り込まれる", ()=>{
    const G=W.G;
    G.chars.c01=G.chars.c01||{dup:0}; // 剣の心得(dmg+5%)
    G.chars.c07=G.chars.c07||{dup:0}; // 聖盾(guard 8%)
    const u=W.tdUnitFrom("c01");
    eq(u.cost, 100, "Nは💠100");
    eq(u.atk, Math.round(W.charStats("c01").atk*1.05), "dmgスキルは攻撃に反映");
    eq(u.pos, 0, "城前に出る");
    const u7=W.tdUnitFrom("c07");
    eq(u7.cost, 150, "Rは💠150");
    eq(u7.def, Math.round(W.charStats("c07").def*1.16), "guardスキルは防御に反映");
    eq(W.tdUnitFrom("c99"), null, "未所持は出せない");
  });
  t("防衛線: 出撃は💠を消費しクールダウンが付く・不足時は出せない", ()=>{
    const G=W.G;
    G.chars.c01=G.chars.c01||{dup:0};
    const b=W.tdNewBattle(W.DUNGEONS[0], {hp:1000, dpt:10, catk:10, elems:[]});
    eq(b.mana, 150, "初期💠150");
    const u=W.tdDeploy(b, "c01");
    ok(u && b.units.length===1, "出撃できる");
    eq(b.mana, 50, "コスト分減る");
    eq(b.cd.c01, 2, "再出撃まで2問");
    ok(!W.tdDeploy(b, "c01"), "クールダウン中は出せない");
    b.cd.c01=0;
    ok(!W.tdDeploy(b, "c01"), "💠不足でも出せない");
  });
  t("防衛線: なかまは敵を足止めして殴り合う(にゃんこ/アークナイツ式)", ()=>{
    const b=W.tdNewBattle(W.DUNGEONS[0], {hp:1000, dpt:10, catk:10, elems:[]});
    b.waves=[[],[],[]]; b.wi=3; // 増援なし
    b.units=[{id:"c01",name:"ノア",rar:1,cost:100,hp:300,hpMax:300,atk:50,def:20,pos:3}];
    b.enemies=[{name:"a",icon:"👾",hp:120,hpMax:120,def:0,atk:30,pos:3}];

    W.tdTick(b); W.tdTick(b);
    eq(b.enemies.length, 0, "殴り合いの末に撃破");
    ok(b.units.length===1 && b.units[0].hp>0, "なかまは生き残る");
    const p0=b.units[0].pos;
    W.tdTick(b);
    eq(b.units[0].pos, p0+1, "交戦が終われば前進する");
  });
  t("防衛線: 出撃デッキは保存され、未所持は除外・未設定は自動編成", ()=>{
    const G=W.G, old=(G.td&&G.td.deck)||null;

    G.td.deck=null;
    const d=W.tdDeck();
    ok(d.length>=1 && d.length<=6, "自動編成(最大6)");
    ok(d.every(id=>G.chars[id]), "所持しているなかまだけ");
    G.td.deck=["c01","c99"];
    eq(W.tdDeck().join(","), "c01", "未所持(c99)は除外される");
    G.td.deck=old;
  });
  t("防衛線: ボス出現でカットインが出る", ()=>{
    W.TD=W.tdNewBattle(W.DUNGEONS[0], {hp:100, dpt:10, catk:10, elems:[]});
    W.renderTDField(null, {leaks:[], spawned:{boss:true, icon:"👾", name:"巨大スライム"}, wave:0}, true);
    const ci=W.document.getElementById("tdCutin");
    ok(!ci.classList.contains("hidden") && ci.innerHTML.indexOf("BOSS")>=0, "カットイン表示");
    ok(W.document.getElementById("tdLog").innerHTML.indexOf("ボス")>=0, "ログにも出る");
    W.TD=null;
  });
  t("防衛線: ボスは2問に1歩・全滅で勝利・城陥落で敗北", ()=>{
    const P={hp:100, dpt:10, catk:10, elems:[]};
    const b=W.tdNewBattle(W.DUNGEONS[0], P);
    b.waves=[[],[],[]]; b.wi=3; // 増援なし
    b.enemies=[{name:"B",icon:"👾",hp:99,hpMax:99,def:0,atk:10,pos:5,boss:true}];
    b.ticks=0;
    W.tdTick(b);
    eq(b.enemies[0].pos, 5, "奇数tickは動かない(2問で1歩)");
    W.tdTick(b);
    eq(b.enemies[0].pos, 4, "偶数tickで1歩");
    const b2=W.tdNewBattle(W.DUNGEONS[0], P);
    b2.waves=[[]]; b2.wi=0; b2.si=0; b2.enemies=[];
    const ev2=W.tdTick(b2);
    ok(ev2.win && b2.over && b2.win, "増援も敵もいなくなったら勝利");
    const b3=W.tdNewBattle(W.DUNGEONS[0], P);
    b3.waves=[[],[],[]]; b3.castle=50;
    b3.enemies=[{name:"a",icon:"👾",hp:10,hpMax:10,def:0,atk:100,pos:0}];
    const ev3=W.tdTick(b3);
    ok(ev3.lose && b3.over && !b3.win, "城HPが尽きたら敗北");
  });
  t("防衛線: 呪文が空でもキャラ攻撃で最低限撃てる(新規プレイヤー保護)", ()=>{
    const b=W.tdNewBattle(W.DUNGEONS[0], {hp:300, dpt:0, catk:34, elems:[]});
    eq(b.P.dpt, 34, "dpt=0ならキャラ攻撃を使う");
    b.enemies=[{name:"a",icon:"👾",hp:9999,hpMax:9999,def:0,atk:10,pos:3}];
    const f=W.tdFire(b, 1);
    ok(f.hits.length===1 && f.hits[0].take>0, "ダメージが出る");
  });
  t("防衛線: 解答は学習タブと同一に計上される(SRS・日別・🎫・コンボ)", ()=>{
    const G=W.G;
    const w=W.WORDS.find(x=>!G.words[x.en]);
    const d0=W.dayRec().a, t0=G.tickets, c0=G.counters.ans;
    const r=W.tdApplyAnswer(w, true);
    ok(r.ok && r.wasNew, "新規判定");
    eq(G.words[w.en][0], 1, "SRS: 正解でbox1");
    eq(W.dayRec().a, d0+1, "日別記録に+1");
    eq(G.tickets, t0+1, "正解1問=🎫1");
    eq(G.counters.ans, c0+1, "累計解答+1");
    ok(G.combo>=1, "コンボ加算");
    W.tdApplyAnswer(w, false);
    eq(G.combo, 0, "ミスでコンボ0");
  });
  t("防衛線: 冒険タブの入口から開始でき、学習タブに触れずに問題が出る", ()=>{
    const G=W.G;
    W.switchTab("adv");
    ok(W.document.getElementById("tdEntry"), "冒険タブに入口パネル");
    W.tdStart(W.DUNGEONS[0]);
    const doc=W.document;
    ok(!doc.getElementById("tdView").classList.contains("hidden"), "防衛線ビューが開く");
    ok(doc.getElementById("quizView").classList.contains("hidden"), "学習タブは独立のまま");
    ok(doc.getElementById("tdWord").textContent.length>0, "問題が出ている");
    eq(doc.querySelectorAll("#tdChoices .choice").length, 4, "4択");
    ok(doc.getElementById("tdCount").textContent.indexOf("今日")>=0, "学習タブと同じ「今日 X/Y問」表記");
    ok(doc.getElementById("tdStats"), "「これまで・定着」の行がある");
    ok(doc.querySelectorAll("#tdDeck .tdu").length>=1, "出撃バーになかまのボタン");
    ok(doc.querySelector("#tdDeck .tdmana"), "💠残高の表示");
    eq(W.TD.enemies.length, 1, "最初の敵が湧いている");
    const w=W.tdCur.word, e2j=G.mode==="e2j";
    const btn=[...doc.querySelectorAll("#tdChoices .choice")].find(b=>b.textContent===(e2j? w.ja : w.en));
    const hp0=W.TD.enemies[0].hp, mana0=W.TD.mana;
    btn.click(); // 正解を選ぶ → 即座に射撃フェーズ(進軍はその後の遅延タイマー)
    ok(W.TD.enemies.length===0 || W.TD.enemies[0].hp<hp0, "敵にダメージ(または撃破)");
    ok(W.TD.mana>mana0, "正解で💠が増える");
    ok(doc.getElementById("tdLog").innerHTML.indexOf("💥")>=0, "射撃のログとダメージポップが出る");
    ok(doc.getElementById("tdLane").classList.contains("tdfire"), "レーンの発火演出");
    W.TD=null; // 後片付け(遅延の進軍・次問タイマーも止まる)
    W.switchTab("home");
  });

  /* ---- 起動状態 ---- */
  t("起動時に問題が出題されている", ()=>{
    ok(W.document.getElementById("promptWord").textContent.length>0);
  });
  t("初期キャラを所持している", ()=>ok(W.G.chars.c01));
  t("初回プレゼント(🎫10)が付与される", ()=>{
    eq(W.G.gift10, 1, "flag");
    ok(W.G.tickets>=10, "tickets="+W.G.tickets);
  });

  }catch(e){
    results.push(["(test harness)", false, String(e.message||e)]);
  }
  runAsync(W).then(report, e=>{
    results.push(["(async harness)", false, String((e&&e.message)||e)]);
    report();
  });
}

/* 非同期テスト(fetch・Cache APIを使うもの)。t()のawait版 */
function ta(name, fn){
  return Promise.resolve().then(fn).then(
    ()=>results.push([name, true, ""]),
    e=>results.push([name, false, String(e.message||e)]));
}
async function runAsync(W){
  await ta("sw.js: 資産はHTTPキャッシュ・CDNを迂回して取り込む(addAll廃止=v4.10.0)", async()=>{
    const txt=await fetch("../sw.js?t="+Date.now()).then(r=>r.text());
    ok(txt.indexOf("addAll(")<0, "addAll(HTTPキャッシュ素通り)を使わない");
    ok(txt.indexOf('cache:"no-store"')>=0, "no-storeで取得する");
    ok(txt.indexOf('"?v="+CACHE')>=0, "版クエリでCDNも迂回する");
  });
  await ta("repairCaches: キャッシュ内の古い資産を最新の内容に置き換える", async()=>{
    ok("caches" in W, "Cache API");
    const url=new URL("../js/state.js", location.href).href;
    const c=await W.caches.open("tq-selftest");
    try{
      await c.put(url, new W.Response("OLD"));
      const n=await W.repairCaches();
      ok(n>=1, "置換件数="+n);
      const txt=await (await c.match(url)).text();
      ok(txt.indexOf("APP_VERSION")>=0, "最新の内容に置き換わる");
    }finally{
      await W.caches.delete("tq-selftest");
    }
  });
}

function report(){
  clearInterval(keepalive);
  const list=document.getElementById("list");
  let pass=0;
  results.forEach(([n,okv,msg])=>{
    const d=document.createElement("div");
    d.className=okv?"ok":"ng";
    d.textContent=(okv?"PASS ":"FAIL ")+n+(msg?" — "+msg:"");
    list.appendChild(d);
    if(okv) pass++;
  });
  const all=pass===results.length;
  document.getElementById("sum").textContent=(all?"ALL PASS":"FAIL")+" ("+pass+"/"+results.length+")";
  document.title=all?"ALL PASS":"FAIL";
  fetch("/__RESULT__/"+(all?"PASS":"FAIL")+"/"+pass+"-"+results.length).catch(()=>{});
  localStorage.removeItem("tangoquest_v1"); // 後片付け
}
