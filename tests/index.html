<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TangoQuest self-tests</title>
<style>
body{font-family:Consolas,monospace; background:#12141f; color:#e9ecf8; padding:16px; font-size:13px}
.ok{color:#4ade80} .ng{color:#f87171} h1{font-size:16px}
#sum{font-weight:bold; font-size:15px; margin:10px 0}
iframe{width:1px; height:1px; opacity:0}
</style>
</head>
<body>
<h1>TangoQuest self-tests</h1>
<div id="sum">running...</div>
<div id="list"></div>
<iframe id="app" src="../index.html"></iframe>
<script>
"use strict";
/* 本番URLで誤って開いてlocalStorageを壊さないためのガード */
if(location.hostname!=="localhost" && location.hostname!=="127.0.0.1"){
  document.body.innerHTML="<p>localhost専用</p>";
  throw new Error("guard");
}
const results=[];
function t(name, fn){
  try{ fn(); results.push([name, true, ""]); }
  catch(e){ results.push([name, false, String(e.message||e)]); }
}
function eq(a,b,msg){ if(a!==b) throw new Error((msg||"")+" expected="+b+" got="+a); }
function ok(v,msg){ if(!v) throw new Error(msg||"falsy"); }

localStorage.removeItem("tangoquest_v1"); // 毎回まっさらな状態で起動させる

const frame=document.getElementById("app");
frame.onload=()=>setTimeout(run, 300);

function run(){
  const W=frame.contentWindow;
  try{

  /* ---- データ ---- */
  t("WORDSが800語以上", ()=>ok(W.WORDS.length>=800, "len="+W.WORDS.length));
  t("全単語にpos(v/n/adj/adv)がある", ()=>{
    const okPos=new Set(["v","n","adj","adv"]);
    W.WORDS.forEach(w=>ok(okPos.has(w.pos), w.en));
  });

  /* ---- カード生成 ---- */
  t("カード生成は決定的", ()=>{
    const a=W.cardOf("abate|3|2"), b=W.cardOf("abate|3|2");
    eq(JSON.stringify(a), JSON.stringify(b));
  });
  t("品詞→役割のマッピング(v3文法)", ()=>{
    const find=p=>W.WORDS.find(w=>w.pos===p);
    ok(W.genCard(find("n"),1,0).val>0, "noun val");
    const a=W.genCard(find("adj"),1,0); ok((a.m>1)||(a.p>1), "adj m/p");
    const d=W.genCard(find("adv"),1,0); ok(d.sub>=0&&d.sub<3, "adv sub");
    const v=W.genCard(find("v"),1,0); ok(v.w>=1&&v.vt>=0, "verb");
  });
  t("レア度・Lvで性能が伸び、長い単語ほど基礎値が大きい", ()=>{
    const w=W.WORDS.find(x=>x.pos==="n");
    ok(W.genCard(w,5,0).val > W.genCard(w,1,0).val, "rar");
    ok(W.genCard(w,1,3).val > W.genCard(w,1,0).val, "lv");
    const sh=W.WORDS.find(x=>x.pos==="n"&&x.en.length<=4);
    const lo=W.WORDS.find(x=>x.pos==="n"&&x.en.length>=10);
    ok(sh&&lo, "sample");
    ok(W.genCard(lo,1,0).val > W.genCard(sh,1,0).val, "len");
  });
  t("ドロップレア度: 新規=★1〜2 / 連続ミス10=★5", ()=>{
    for(let i=0;i<50;i++){
      const r=W.dropRarity(null); ok(r>=1&&r<=2, "new r="+r);
      const r2=W.dropRarity([0,0,0,10,0,10,0]); eq(r2,5,"ws10");
    }
  });

  /* ---- 在庫・重ね(v4.0.0: 合成廃止・重ねるだけでLvが上がる) ---- */
  t("同じカードを重ねるとLvが上がる(2枚=+1・上限なし)", ()=>{
    const G=W.G;
    const en=W.WORDS[0].en, k=en+"|1|0";
    delete G.inv[k];
    W.addCard(en,1);
    eq(W.cardOf(k).lv, 0, "1枚=Lv0");
    W.addCard(en,1);
    eq(W.cardOf(k).lv, 1, "2枚=+1");
    for(let i=0;i<13;i++) W.addCard(en,1);
    eq(W.cardOf(k).lv, 14, "15枚=+14(上限なし)");
    delete G.inv[k];
  });
  t("重ねるほどカードは強くなる(+10以降も伸び続ける)", ()=>{
    const w=W.WORDS.find(x=>x.pos==="n");
    const v0=W.genCard(w,1,0).val, v10=W.genCard(w,1,10).val, v20=W.genCard(w,1,20).val;
    ok(v10>v0, "+10で強化");
    ok(v20>v10, "+10以降も伸びる");
    ok(v20-v10 < v10-v0, "伸びは緩やかになる");
  });
  t("旧「+Lv」在庫は枚数(2^lv)に換算して移行される", ()=>{
    const g={inv:{"foo|2|2":1, "foo|2|0":3, "bar|1|1":2},
             party:{sentence:["foo|2|2", "bar|1|1", "foo|2|0", null]}};
    W.migrateInvToStacks(g);
    eq(g.inv["foo|2|0"], 7, "1×4+3=7枚");
    eq(g.inv["bar|1|0"], 4, "2×2=4枚");
    ok(!g.inv["foo|2|2"] && !g.inv["bar|1|1"], "旧キーは消える");
    eq(g.party.sentence[0], "foo|2|0", "文のキーも基本形へ");
    eq(g.party.sentence[1], "bar|1|0");
    eq(g.party.sentence[2], null, "同一カードの重複配置は解消");
    W.migrateInvToStacks(g);
    eq(g.inv["foo|2|0"], 7, "再実行しても変わらない(冪等)");
  });
  t("2枚目からは「重ね」として任務に計上される", ()=>{
    const G=W.G;
    const en=W.WORDS[10].en, k=en+"|2|0";
    delete G.inv[k];
    const m0=G.counters.merges;
    W.addCard(en,2);
    eq(G.counters.merges, m0, "1枚目は重ねではない");
    W.addCard(en,2);
    eq(G.counters.merges, m0+1, "2枚目=重ね1回");
    delete G.inv[k];
  });

  /* ---- 戦闘 ---- */
  t("強者は勝ち弱者は負ける(v2スナップショット互換も含む)", ()=>{
    // atkのみのv2形式スナップショットでも動く(無限回廊の旧セーブ互換)
    const strong={name:"S",hp:1000,atk:500,def:100,spd:20};
    const weak={name:"W",hp:100,atk:5,def:0,spd:5};
    ok(W.simBattle(strong, Object.assign({},weak)).win, "strong wins");
    ok(!W.simBattle(Object.assign({},weak,{name:"W2"}), Object.assign({},strong)).win, "weak loses");
  });
  t("敵はtier/floorで強くなる", ()=>{
    const e1=W.enemyFor(1,1,5,false,["a"],"b");
    const e2=W.enemyFor(2,1,5,false,["a"],"b");
    const e3=W.enemyFor(1,4,5,false,["a"],"b");
    ok(e2.hp>e1.hp, "tier"); ok(e3.hp>e1.hp, "floor");
  });
  t("文に名詞を置くとダメージ/ターンと戦闘力が上がる", ()=>{
    const G=W.G;
    G.party.sentence=[];
    const p0=W.playerStats();
    const w=W.WORDS.filter(x=>x.pos==="n")[2];
    W.addCard(w.en,3);
    G.party.sentence=[w.en+"|3|0"];
    const p1=W.playerStats();
    ok(p1.dpt>p0.dpt, "dpt");
    ok(p1.power>p0.power, "power");
  });

  /* ---- 任務・計上 ---- */
  t("track()がデイリー/ウィークリー/累計を計上する", ()=>{
    const G=W.G;
    const before=G.counters.cor;
    const d0=W.dailyRec().c;
    W.track("cor");
    eq(G.counters.cor, before+1);
    eq(W.dailyRec().c, d0+1);
  });
  t("正解10問でデイリー任務が受取可能になる", ()=>{
    const d=W.dailyRec();
    d.c=10; d.cl={};
    ok(W.hasClaimable(), "claimable");
  });

  /* ---- かけら経済 ---- */
  t("分解でかけらが増え在庫が減る", ()=>{
    const G=W.G;
    const en=W.WORDS[20].en;
    W.addCard(en,3);
    const s0=G.shards;
    const gain=W.disassemble(en+"|3|0",1);
    eq(gain, 8, "★3=8かけら");
    eq(G.shards, s0+8, "shards added");
    ok(!G.inv[en+"|3|0"], "consumed");
  });
  t("かけらで「重ねる」: 同キーの枚数が増えかけらが減る", ()=>{
    const G=W.G;
    const en=W.WORDS[21].en, k=en+"|1|0";
    delete G.inv[k];
    W.addCard(en,1);
    G.shards=100;
    const nk=W.enhanceOne(k);
    eq(nk, k, "キーは変わらない");
    eq(G.inv[k], 2, "2枚=Lv+1");
    eq(G.shards, 98, "cost=★1のLv0は2");
    const c=W.cardOf(k);
    eq(c.lv, 1, "Lv+1");
    ok(W.enhCost(c)>2, "重ねるほど次の1枚が高くつく");
    delete G.inv[k];
  });
  t("一括分解は編成中カードに一切触れない", ()=>{
    const G=W.G;
    const oldInv=G.inv, oldSent=G.party.sentence;
    const w=W.WORDS.filter(x=>x.pos==="n")[3];
    const w2=W.WORDS.filter(x=>x.pos==="n")[5];
    G.inv={};
    W.addCard(w.en,1); W.addCard(w.en,1);
    W.addCard(w2.en,1);
    G.party.sentence=[w.en+"|1|0"];
    const r=W.bulkDisassemble(1,false);
    eq(G.inv[w.en+"|1|0"], 2, "装備中は枚数ごと残る(=Lv維持)");
    ok(!G.inv[w2.en+"|1|0"], "非装備は分解される");
    eq(r.cnt, 1, "分解は1枚だけ");
    G.inv=oldInv; G.party.sentence=oldSent;
  });
  t("同じカードは文に1枠しか置けない", ()=>{
    const G=W.G;
    const oldInv=G.inv, oldSent=G.party.sentence;
    const w=W.WORDS.filter(x=>x.pos==="n")[6];
    G.inv={};
    W.addCard(w.en,1); W.addCard(w.en,1); W.addCard(w.en,1);
    G.party.sentence=[null,null,null,null];
    eq(W.quickEquip(w.en+"|1|0"), 1, "1回目は置ける");
    eq(W.quickEquip(w.en+"|1|0"), null, "2枠目は置けない");
    G.inv=oldInv; G.party.sentence=oldSent;
  });

  /* ---- 属性・セット効果 ---- */
  t("属性は決定的(レア・Lvで不変)で0〜4", ()=>{
    const a=W.genCard(W.WORDS[0],1,0), b=W.genCard(W.WORDS[0],3,2);
    ok(a.elem>=0 && a.elem<5, "range");
    eq(a.elem, b.elem, "stable");
  });
  t("同属性2枚でセット効果(ダメージ×1.05)が発動する", ()=>{
    const cards=W.WORDS.filter(x=>x.pos==="n").map(x=>W.genCard(x,1,0));
    const a=cards[0];
    const b=cards.find(c=>c.en!==a.en && c.elem===a.elem);
    ok(b, "同属性ペアが存在");
    const P=W.playerStats([a.key, b.key]);
    ok(P.sets && P.sets.length===1, "set reported");
    eq(P.sets[0].n, 2, "count=2");
    eq(P.sets[0].b, 0.05, "+5%");
    ok(Math.abs(P.setM-1.05)<1e-9, "setM");
  });

  /* ---- 発動タイプ・属性相性・敵の特性 ---- */
  t("動詞カードに発動タイプ(0〜3)が決定的に付く", ()=>{
    const v=W.WORDS.find(w=>w.pos==="v");
    const a=W.genCard(v,1,0), b=W.genCard(v,4,3);
    ok(a.vt>=0 && a.vt<4, "range");
    eq(a.vt, b.vt, "レア・Lvで不変");
  });
  t("発動タイプは4種すべて存在する", ()=>{
    const types=new Set(W.WORDS.filter(w=>w.pos==="v").map(w=>W.genCard(w,1,0).vt));
    eq(types.size, 4, "found="+[...types].join(","));
  });
  t("属性相性: 有利カードで与ダメ増・被ダメ減", ()=>{
    const m=W.elemMatch([0,0,3,0,0], 1); // 風3枚 vs 水属性の敵(風は水に強い)
    eq(m.adv, 3, "adv");
    ok(Math.abs(m.dealt-1.21)<1e-9, "dealt="+m.dealt);
    ok(Math.abs(m.taken-0.88)<1e-9, "taken="+m.taken);
    const n=W.elemMatch([0,0,3,0,0], null);
    eq(n.dealt, 1, "属性なしは等倍");
  });
  t("貫通は高防御の敵に有効", ()=>{
    const E=()=>({name:"e",hp:2000,atk:1,def:900,spd:1});
    const P=vt=>({name:"p",hp:500,def:0,spd:10,charM:1,setM:1,amp:1,guard:0,
                  clauses:[{V:300,vt,w:1,name:"x",words:[]}]});
    ok(W.simBattle(P(1),E()).win, "貫通は倒せる");
    ok(!W.simBattle(P(0),E()).win, "強撃は防御に阻まれる");
  });
  t("吸収は回復する", ()=>{
    const r=W.simBattle({name:"p",hp:1000,def:0,spd:10,charM:1,setM:1,amp:1,guard:0,
      clauses:[{V:250,vt:2,w:1,name:"d",words:[]}]},
      {name:"e",hp:5000,atk:50,def:0,spd:1});
    ok(r.log.some(e=>e.heal>0), "healログ");
  });
  t("敵の特性: toughは防御が上がりswiftは速くなる", ()=>{
    const base=W.enemyFor(3,1,5,false,["a"],"b");
    const tough=W.enemyFor(3,1,5,false,["a"],"b",{trait:"tough"});
    const swift=W.enemyFor(3,1,5,false,["a"],"b",{trait:"swift"});
    ok(tough.def>base.def*2, "tough def");
    ok(swift.spd>base.spd, "swift spd");
    eq(W.enemyFor(3,1,5,false,["a"],"b",{elem:2}).elem, 2, "elem引き継ぎ");
  });

  /* ---- 呪文文法(v3.0.0) ---- */
  t("文評価: 形容詞は直後の名詞に係る", ()=>{
    const adjM=W.WORDS.filter(x=>x.pos==="adj").map(x=>W.genCard(x,1,0)).find(c=>c.sub===0);
    const noun=W.genCard(W.WORDS.find(x=>x.pos==="n"),1,0);
    const ev=W.evalSentence([adjM.key, noun.key]);
    eq(ev.clauses.length, 1, "節1つ");
    eq(ev.clauses[0].V, Math.round(noun.val*adjM.m), "×m適用");
  });
  t("文評価: 乗算と累乗の並び順で結果が変わる(名詞に近い方から適用)", ()=>{
    const adjs=W.WORDS.filter(x=>x.pos==="adj").map(x=>W.genCard(x,4,0));
    const m=adjs.find(c=>c.sub===0), p=adjs.find(c=>c.sub===1);
    const n=W.genCard(W.WORDS.filter(x=>x.pos==="n")[3],4,0);
    const a=W.evalSentence([m.key, p.key, n.key]).clauses[0].V; // (v^p)×m
    const b=W.evalSentence([p.key, m.key, n.key]).clauses[0].V; // (v×m)^p
    eq(a, Math.round(Math.pow(n.val,p.p)*m.m), "近い方から適用");
    ok(Math.abs(a-b)>=2, "並び順で差が出る a="+a+" b="+b);
  });
  t("文評価: 動詞で節が区切られ、動詞なしの残りは素の一撃", ()=>{
    const ns=W.WORDS.filter(x=>x.pos==="n");
    const v=W.genCard(W.WORDS.find(x=>x.pos==="v"),1,0);
    const ev=W.evalSentence([ns[0].en+"|1|0", v.key, ns[1].en+"|1|0"]);
    eq(ev.clauses.length, 2, "節2つ");
    eq(ev.clauses[0].name, v.en, "節1=動詞");
    eq(ev.clauses[1].name, null, "節2=素の一撃");
  });
  t("文評価: 係り先の無いカードは不発として報告される", ()=>{
    const adj=W.genCard(W.WORDS.find(x=>x.pos==="adj"),1,0);
    const v=W.genCard(W.WORDS.find(x=>x.pos==="v"),1,0);
    const e1=W.evalSentence([adj.key]);
    ok(e1.dead[0]!=null && e1.clauses.length===0, "形容詞のみ=不発");
    const e2=W.evalSentence([v.key]);
    ok(e2.dead[0]!=null, "名詞なし動詞=不発");
  });
  t("文評価: 増幅は全体に掛かり、守護は60%で頭打ち", ()=>{
    const advs=W.WORDS.filter(x=>x.pos==="adv");
    const amp=advs.map(x=>W.genCard(x,1,0)).find(c=>c.sub===1);
    const gs=advs.map(x=>W.genCard(x,5,9)).filter(c=>c.sub===2).slice(0,3);
    ok(amp && gs.length>=3, "サンプル確保");
    const n=W.WORDS.find(x=>x.pos==="n");
    const e1=W.evalSentence([n.en+"|1|0", amp.key]);
    ok(Math.abs(e1.amp-amp.m)<1e-9, "amp");
    // v4: キーはlvを含まない。高Lvは「重ね枚数」(在庫10枚=+9)で表現する
    const G=W.G, bak={};
    gs.forEach(c=>{ bak[c.key]=G.inv[c.key]; G.inv[c.key]=10; });
    const e2=W.evalSentence(gs.map(c=>c.key));
    gs.forEach(c=>{ if(bak[c.key]==null) delete G.inv[c.key]; else G.inv[c.key]=bak[c.key]; });
    eq(e2.guard, 60, "guard cap");
  });
  t("文評価: 反復は直前の発動をもう一度", ()=>{
    const rep=W.WORDS.filter(x=>x.pos==="adv").map(x=>W.genCard(x,1,0)).find(c=>c.sub===0);
    const n=W.WORDS.find(x=>x.pos==="n"), v=W.genCard(W.WORDS.find(x=>x.pos==="v"),1,0);
    const ev=W.evalSentence([n.en+"|1|0", v.key, rep.key]);
    ok(Math.abs(ev.clauses[0].rep-rep.r)<1e-9, "rep付与");
  });
  t("quickEquipは文の最初の空きスロットに置く", ()=>{
    const G=W.G;
    G.party.sentence=[null,null,null,null];
    const w=W.WORDS.filter(x=>x.pos==="n")[4];
    W.addCard(w.en,1);
    const pos=W.quickEquip(w.en+"|1|0");
    eq(pos, 1, "1語目に配置");
    eq(G.party.sentence[0], w.en+"|1|0");
  });
  t("v2セーブの装備は文に移行される", ()=>{
    const g={party:{equip:{weapon:"a|1|0", buff1:"b|1|0", skill1:"c|1|0"}}};
    W.migrateEquipToSentence(g);
    ok(Array.isArray(g.party.sentence), "配列化");
    eq(g.party.sentence[0], "b|1|0", "形容詞が文頭");
    eq(g.party.sentence[1], "a|1|0", "名詞が続く");
    ok(!g.party.equip, "旧形式は消える");
  });
  t("文の長さは知識レベルで4→8語に伸びる", ()=>{
    const G=W.G; const x0=G.xp;
    G.xp=0;   eq(W.sentenceSlots(), 4, "Lv1");
    G.xp=1e6; eq(W.sentenceSlots(), 8, "高Lv");
    G.xp=x0;
  });
  t("バランス: 少し集めた文(★2〜3)で草原を完全攻略できる", ()=>{
    const ns=W.WORDS.filter(x=>x.pos==="n").slice(5,7);
    const adj=W.WORDS.filter(x=>x.pos==="adj").map(x=>W.genCard(x,3,0)).find(c=>c.sub===0);
    const vb=W.genCard(W.WORDS.find(x=>x.pos==="v"),2,0);
    const P=W.playerStats([adj.key, ns[0].en+"|3|0", ns[1].en+"|2|0", vb.key]);
    let hp=P.hp, full=true;
    for(let f=1; f<=5; f++){
      const E=W.enemyFor(1,f,5,f===5,["a"],"b",{elem:2});
      const r=W.simBattle(Object.assign({},P,{hp}), E);
      if(!r.win){ full=false; break; }
      hp=Math.min(P.hp, Math.round(r.php+P.hp*0.25));
    }
    ok(full, "d1 full clear (power="+P.power+")");
  });

  /* ---- 語源(語根)システム(v3.1.0) ---- */
  t("語根タグは決定的で、既知の単語が正しく引ける", ()=>{
    const a=W.wordRoots("inspect"), b=W.wordRoots("inspect");
    eq(JSON.stringify(a), JSON.stringify(b), "決定的");
    const spec=W.wordRoots("inspect").find(t=>t.kind==="R");
    eq(W.ROOT_DEFS[spec.i].t, "spec", "inspect→spec");
    const port=W.wordRoots("transport").find(t=>t.kind==="R");
    eq(W.ROOT_DEFS[port.i].t, "port", "transport→port");
  });
  t("語根カバレッジ: 5割以上の単語に語源タグが付く", ()=>{
    let any=0, root=0;
    W.WORDS.forEach(w=>{
      const tags=W.wordRoots(w.en);
      if(tags.length) any++;
      if(tags.some(t=>t.kind==="R")) root++;
    });
    ok(any/W.WORDS.length>=0.50, "any="+any);
    ok(root/W.WORDS.length>=0.32, "root="+root);
  });
  t("語源の正しさ(レビュー済み代表例)", ()=>{

    // 語根を共有する名詞ペアを探す

    let a=null, b=null;
    outer:
    for(const x of ns){
      const rx=W.rootIdsOf(x.en); if(!rx.length) continue;
      for(const y of ns){
        if(y.en===x.en) continue;
        if(W.rootIdsOf(y.en).some(r=>rx.includes(r))){ a=x; b=y; break outer; }

    const ca=W.genCard(a,1,0), cb=W.genCard(b,1,0);
    const ev=W.evalSentence([ca.key, cb.key]);
    eq(ev.clauses[0].res, 1.35, "res");
    eq(ev.clauses[0].V, Math.round((ca.val+cb.val)*1.35), "節値に反映");
    ok(ev.clauses[0].resRoots.length>=1, "共鳴語根の報告");
  });

    G.counters.cor=10; eq(W.corTicketGain(), 1, "10問目で1");

    G.counters.cor=0;  eq(W.corTicketGain(), 0, "0は対象外");
    G.counters.cor=c0;
  });
  t("連続正解コンボ: XP倍率とドロップ★率が伸びて頭打ち", ()=>{
    const G=W.G; const b=G.combo;
    G.combo=0;  ok(Math.abs(W.comboXpMult()-1)<1e-9, "0=×1"); eq(W.comboDropBonus(), 0, "5未満は0");
    G.combo=6;  ok(Math.abs(W.comboXpMult()-1.20)<1e-9, "6連続=×1.2");
    ok(Math.abs(W.comboDropBonus()-0.12)<1e-9, "6連続=12%");
    G.combo=99; ok(Math.abs(W.comboXpMult()-1.6)<1e-9, "上限×1.6");
    ok(Math.abs(W.comboDropBonus()-0.30)<1e-9, "上限30%");
    G.combo=b;
  });
  t("ログインボーナスは毎日🎫1以上", ()=>{
    ok(W.LOGIN_BONUS.length===7 && W.LOGIN_BONUS.every(x=>(x.t||0)>=1), JSON.stringify(W.LOGIN_BONUS));
  });
  t("ダンジョン周回: 本日3回目以降のクリアはゴールド25%", ()=>{
    const today=W.todayKey();
    eq(W.repeatGoldMult({clears:5, lastClearDay:today, dayClears:2}), 0.25, "3回目〜");
    eq(W.repeatGoldMult({clears:5, lastClearDay:today, dayClears:1}), 1, "2回目まで");
    eq(W.repeatGoldMult({clears:5, lastClearDay:"2000-01-01", dayClears:9}), 1, "日が変われば戻る");
    eq(W.repeatGoldMult({clears:0, lastClearDay:null}), 1, "初回");
  });
  t("実績が拡張されている(なかま32段階・ガチャ1000・突破合計)", ()=>{
    const by={}; W.ACH_DEFS.forEach(a=>by[a.id]=a);
    ok(by.achr.tiers.length>=6 && by.achr.tiers[by.achr.tiers.length-1][0]===32, "achr最終=32");
    ok(by.apul.tiers.length>=5 && by.apul.tiers[by.apul.tiers.length-1][0]===1000, "apul最終=1000");
    ok(by.adup, "adupが存在");
    const G=W.G; const old=JSON.parse(JSON.stringify(G.chars));
    G.chars={a:{dup:3}, b:{dup:4}};
    eq(by.adup.cur(), 7, "突破合計=7");
    G.chars=old;
  });
  t("デイリー/ウィークリーにクイズ系任務が追加されている", ()=>{
    ok(W.DAILY_DEFS.some(m=>m.id==="dc2"), "dc2");
    ok(W.WEEKLY_DEFS.some(m=>m.id==="wc2"), "wc2");
  });
  t("お知らせ: イベントとアップデートが分かれ、イベントが上", ()=>{
    const ev=W.newsEvents();
    ok(ev.length>=1, "開催中/予告のバナーがイベント化 n="+ev.length);
    ok(ev.every(x=>x.t.indexOf("開催中")>=0 || x.t.indexOf("予告")>=0), "状態表示");
    W.openNews();
    const html=W.document.getElementById("modal").innerHTML;
    ok(html.indexOf("イベント")>=0 && html.indexOf("アップデート")>=0, "2セクション");
    ok(html.indexOf("イベント") < html.indexOf("アップデート"), "イベントが上");
    W.closeModal();
    W.localStorage.removeItem("tq_newsSeen");
  });

  /* ---- v4.1.0: 図鑑・ガチャ演出 ---- */
  t("図鑑: カード/なかまの取得状況を集計する", ()=>{
    const G=W.G;
    const oldInv=G.inv;
    G.inv={};
    W.addCard(W.WORDS[0].en,1); W.addCard(W.WORDS[1].en,3);
    const st=W.cardDexStats();
    eq(st.owned, 2, "2種取得");
    eq(st.total, W.WORDS.length, "母数=全単語");
    const cs=W.charDexStats();
    ok(cs.owned>=1 && cs.total===W.CHARS.length, "なかま集計 owned="+cs.owned);
    G.inv=oldInv;
  });
  t("図鑑モーダル: 空き枠は窪み・切替でなかま図鑑(未加入は???)", ()=>{
    const G=W.G;
    const oldInv=G.inv;
    G.inv={};
    W.addCard(W.WORDS[0].en,2);
    W.openDex("cards");
    const doc=W.document;
    eq(doc.querySelectorAll("#dexGrid .dexcell.own").length, 1, "取得済み1枠");
    eq(doc.querySelectorAll("#dexGrid .dexcell.miss").length, W.WORDS.length-1, "残りは窪み枠");
    doc.querySelector('#dexSeg [data-m="chars"]').click();
    eq(doc.querySelectorAll("#dexCharGrid .dexchar").length, W.CHARS.length, "全キャラ表示");
    ok(doc.querySelectorAll("#dexCharGrid .dexchar.miss").length>0, "未加入は窪み+シルエット");
    W.closeModal();
    G.inv=oldInv;
  });
  t("ガチャ結果はフリップ公開+重複は突破ポップ", ()=>{
    const G=W.G;
    G.chars.c01=G.chars.c01||{dup:0};
    const d0=G.chars.c01.dup;
    G.chars.c01.dup=2;
    const html=W.gresHTML({c:W.CHARS[0], isNew:false}, 0);
    ok(html.indexOf("gbk")>=0 && html.indexOf("gfr")>=0, "裏面/表面の2層");
    ok(html.indexOf("突破+2!")>=0, "凸演出ポップ");
    const html2=W.gresHTML({c:W.CHARS[1], isNew:true}, 1);
    ok(html2.indexOf("gdup")<0, "NEWにはポップなし");
    G.chars.c01.dup=d0;
  });

  /* ---- v3.6.0: バージョン表記・選択肢のランダム性 ---- */
  t("APP_VERSIONが定義され設定に表示される", ()=>{
    ok(/^\d+\.\d+\.\d+$/.test(W.APP_VERSION), "semver: "+W.APP_VERSION);
    W.openSettings();
    ok(W.document.getElementById("modal").innerHTML.indexOf("v"+W.APP_VERSION)>=0, "設定に表示");
    W.closeModal();
  });
  t("クイズ: 誤答の組合せと正解の位置は毎回ランダムに変わる", ()=>{
    const w=W.WORDS[0];
    const sets=new Set(), pos=new Set();
    for(let i=0;i<30;i++){
      const cs=W.buildChoices(w);
      eq(cs.length, 4, "4択");
      ok(cs.some(c=>c.en===w.en), "正解を含む");
      sets.add(cs.filter(c=>c.en!==w.en).map(c=>c.en).sort().join(","));
      pos.add(cs.findIndex(c=>c.en===w.en));
    }
    ok(sets.size>=5, "誤答の組合せが変わる sets="+sets.size);
    ok(pos.size>=3, "正解の位置が変わる pos="+pos.size);
  });

  /* ---- 起動状態 ---- */
  t("起動時に問題が出題されている", ()=>{
    ok(W.document.getElementById("promptWord").textContent.length>0);
  });
  t("初期キャラを所持している", ()=>ok(W.G.chars.c01));
  t("初回プレゼント(🎫10)が付与される", ()=>{
    eq(W.G.gift10, 1, "flag");
    ok(W.G.tickets>=10, "tickets="+W.G.tickets);
  });

  }catch(e){
    results.push(["(test harness)", false, String(e.message||e)]);
  }
  report();
}

function report(){
  const list=document.getElementById("list");
  let pass=0;
  results.forEach(([n,okv,msg])=>{
    const d=document.createElement("div");
    d.className=okv?"ok":"ng";
    d.textContent=(okv?"PASS ":"FAIL ")+n+(msg?" — "+msg:"");
    list.appendChild(d);
    if(okv) pass++;
  });
  const all=pass===results.length;
  document.getElementById("sum").textContent=(all?"ALL PASS":"FAIL")+" ("+pass+"/"+results.length+")";
  document.title=all?"ALL PASS":"FAIL";
  fetch("/__RESULT__/"+(all?"PASS":"FAIL")+"/"+pass+"-"+results.length).catch(()=>{});
  localStorage.removeItem("tangoquest_v1"); // 後片付け
}
</script>
