<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E8EDF5">
<meta name="description" content="LEXICA(レキシカ) ─ 英単語を解いてカードを集め、ダンジョンを攻略する単語学習RPG。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>LEXICA ─ 単語と冒険の書</title>
</head>
<body>

<header>
  <div class="title">⚔ LEXICA</div>
  <div class="res"><span class="ic">📖</span><span id="resLv">Lv1</span></div>
  <div class="res"><span class="ic">🪙</span><span id="resGold">0</span></div>
  <div class="res"><span class="ic">🎫</span><span id="resTicket">0</span></div>
  <button id="gearBtn">⚙</button>
</header>

<!-- ============ ホーム ============ -->
<main id="homeView">
  <div id="homeBox"></div>
</main>

<!-- ============ 学習(クイズ) ============ -->
<main id="quizView" class="hidden">
  <div id="infPill"><span>🌀 無限回廊</span><b id="infPillTxt"></b></div>
  <div id="promptCard">
    <span id="qBadge">新規</span>
    <span id="qCount"></span>
    <div id="promptWord"></div>
    <div id="qStats"></div>
  </div>
  <div class="choices" id="choices"></div>
  <div id="resultBar">
    <div id="resultInfo">
      <div id="resultHead"></div>
      <div id="resultCard"></div>
    </div>
    <button id="nextBtn">次へ ▶</button>
  </div>
</main>

<!-- ============ 編成(そうび・カード・なかま) ============ -->
<main id="partyView" class="hidden">
  <div class="seg" id="partySeg">
    <button data-p="equip" class="active">そうび</button>
    <button data-p="cards">カード</button>
    <button data-p="chars">なかま</button>
  </div>
  <div id="pEquip">
    <div class="row">
      <div class="grow">戦闘力 <b id="eqPower" style="color:var(--accent); font-size:18px">0</b></div>
      <button class="btn primary" id="autoEqBtn">✨ おまかせ</button>
      <button class="btn" id="unEqBtn">解除</button>
    </div>
    <div class="small" id="eqSets" style="margin-top:4px"></div>
    <div class="charsel" id="eqChars"></div>
    <div id="doll">
      <div class="dollcol" id="dollLeft"></div>
      <div id="dollChar">
        <div id="dollFace">🗡️</div>
        <div id="dollName"></div>
        <div id="dollStats" class="small"></div>
      </div>
      <div class="dollcol" id="dollRight"></div>
    </div>
    <div id="dollSkills"></div>
  </div>
  <div id="pCards" class="hidden">
    <div class="row">
      <div class="grow small" id="cardSummary"></div>
      <button class="btn" id="autoMergeBtn">⚒ 合成</button>
      <button class="btn" id="bulkDisBtn">✨ 分解</button>
    </div>
    <div class="seg" id="cardFilter">
      <button data-f="all" class="active">すべて</button>
      <button data-f="n">装備</button>
      <button data-f="adj">強化</button>
      <button data-f="adv">場</button>
      <button data-f="v">技</button>
    </div>
    <div id="cardGrid"></div>
  </div>
  <div id="pChars" class="hidden">
    <div id="charGrid"></div>
  </div>
</main>

<!-- ============ 冒険 ============ -->
<main id="advView" class="hidden">
  <div class="panel" id="infPanel" style="margin-top:6px"></div>
  <h2>ダンジョン</h2>
  <div id="dungeonList"></div>
</main>

<!-- ============ ガチャ ============ -->
<main id="gachaView" class="hidden">
  <div id="gachaBox"></div>
</main>

<!-- ============ 任務 ============ -->
<main id="missionView" class="hidden">
  <div class="seg" id="missionSeg">
    <button data-m="daily" class="active">デイリー<span class="segdot hidden" id="segDotD"></span></button>
    <button data-m="weekly">ウィークリー<span class="segdot hidden" id="segDotW"></span></button>
    <button data-m="ach">実績<span class="segdot hidden" id="segDotA"></span></button>
  </div>
  <div class="panel" id="missionList"></div>
</main>

<nav>
  <button id="navHome" class="active"><span class="nic badge">🏰<span class="dot hidden" id="navHomeDot"></span></span>ホーム</button>
  <button id="navQuiz"><span class="nic">📖</span>学習</button>
  <button id="navParty"><span class="nic">🛡️</span>編成</button>
  <button id="navAdv"><span class="nic">🗺️</span>冒険</button>
  <button id="navGacha"><span class="nic">🔮</span>ガチャ</button>
</nav>

<div id="overlay"><div id="modal"></div></div>
<div id="toast"></div>

<script src="js/words.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/cards.js"></script>
<script src="js/chars.js"></script>
<script src="js/battle.js"></script>
<script src="js/quiz.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/missions.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
