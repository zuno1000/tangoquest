<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- ステータスバーは default(不透明・本文はバーの下から)で確定(v4.5.0)。
     実機検証の結論:
     ・black-translucent+viewport-fit=cover → 下端がシステムの灰色で
       レターボックス化されタブが持ち上がる・モーダル下部が隠れる(IMG_1674/1676)
     ・default → 常時正常。ただし新規インストール初回起動のみステータスバー領域が
       灰色に塗られるiOSバグがある(IMG_1673)→ main.js の初回自動リロードで回避 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8EDF5">
<meta name="description" content="LEXICA(レキシカ) ─ 英単語を解いてカードを集め、押し寄せる敵をしのぐ単語学習サバイバーRPG。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>LEXICA ─ 単語と冒険の書</title>
</head>
<body>

<header>
  <div class="title">LEXICA</div>
  <div class="res"><span class="ic">📖</span><span id="resLv">Lv1</span></div>
  <div class="res"><span class="ic">🪙</span><span id="resGold">0</span></div>
  <div class="res"><span class="ic">🎫</span><span id="resTicket">0</span></div>
  <button id="bellBtn">🔔<span class="dot hidden" id="bellDot"></span></button>
  <button id="gearBtn">⚙</button>
</header>

<!-- ============ ホーム ============ -->
<main id="homeView">
  <div id="homeBox"></div>
</main>

<!-- ============ 学習(クイズ) ============ -->
<main id="quizView" class="hidden">
  <!-- 学習対象の切替(v5.0.0): 単語=従来のSRSクイズ/フレーズ=意図→英語の産出訓練 -->
  <div class="seg qseg" id="quizSeg">
    <button data-q="w" class="active">単語</button>
    <button data-q="p">フレーズ</button>
  </div>
  <div id="promptCard">
    <span id="qBadge">新規</span>
    <span id="qCount"></span>
    <div id="promptWord"></div>
    <div id="qStats"></div>
    <!-- フレーズの並べ替えの組み立て行+答え合わせの全文表示(単語モードでは隠す) -->
    <div id="phrBuild" class="hidden"></div>
  </div>
  <div class="choices" id="choices"></div>
  <div id="resultBar">
    <div id="resultInfo">
      <div id="resultCard"></div>
    </div>
    <button id="nextBtn">次へ ▶</button>
  </div>
</main>

<!-- ============ 編成(そうび・カード・なかま) ============ -->
<main id="partyView" class="hidden">
  <div class="seg" id="partySeg">
    <button data-p="equip" class="active">呪文</button>
    <button data-p="cards">カード</button>
    <button data-p="chars">なかま</button>
  </div>
  <div id="pEquip">
    <div class="row">
      <div class="grow">戦闘力 <b id="eqPower" style="color:var(--accent); font-size:18px">0</b></div>
      <button class="btn primary" id="autoEqBtn">✨ おまかせ</button>
      <button class="btn" id="unEqBtn">解除</button>
    </div>
    <div id="eqChars"></div>
    <h2 style="margin:10px 4px 6px">📜 呪文 <span class="small" id="slotInfo"></span></h2>
    <div id="sentenceRow"></div>
    <div class="small" id="eqSets" style="margin-top:8px"></div>
    <!-- ダメージの式は開閉に畳む(v4.30.0のUI集約。開閉はutil.jsのdata-fold委譲ハンドラ) -->
    <button class="btn fold" data-fold="formulaWrap" aria-expanded="false" id="formulaToggle">
      <span class="grow" style="text-align:left">🧮 ダメージの式(しくみをくわしく)</span><span class="fchev">▼</span></button>
    <div class="foldbody" id="formulaWrap" hidden><div class="panel" id="formulaBox" style="margin-top:6px"></div></div>
  </div>
  <div id="pCards" class="hidden">
    <div class="row">
      <div class="grow small" id="cardSummary"></div>
    </div>
    <div class="seg" id="cardFilter">
      <button data-f="all" class="active">すべて</button>
      <button data-f="n">名詞</button>
      <button data-f="adj">形容詞</button>
      <button data-f="v">動詞</button>
      <button data-f="adv">副詞</button>
    </div>
    <div id="cardGrid"></div>
  </div>
  <div id="pChars" class="hidden">
    <div class="seg" id="charSortSeg">
      <button data-s="rar" class="active">レア</button>
      <button data-s="pow">力</button>
      <button data-s="dup">突破</button>
      <button data-s="dex">図鑑順</button>
    </div>
    <div id="charGrid"></div>
  </div>
</main>

<!-- ============ 冒険(v4.25.0: サバイバー一本化 ─ 中身はsv.jsのrenderAdvが描く) ============ -->
<main id="advView" class="hidden">
  <div id="svHub"></div>
</main>

<!-- ============ 単語のサバイバー(β・冒険タブから入る) ============ -->
<main id="svView" class="hidden">
  <!-- .svcolは既定でdisplay:contents(レイアウト透過=スマホは従来どおりの縦一列)。
       PC(1024px以上・pointer:fine)でだけ戦場/クイズの2カラムになる(v4.24.0・todaybgm方式) -->
  <div class="svcol" id="svColL">
    <!-- ヘッダーは1行に圧縮: 戻る+ステージ/残り時間+自機HP(クイズUIを最大化する=防衛線の知見) -->
    <div class="row" id="svHead" style="margin-top:4px; gap:8px; align-items:center">
      <button class="btn" id="svBack" style="padding:7px 12px">←</button>
      <div class="grow" style="font-weight:800; font-size:12px; line-height:1.3" id="svTitle"></div>
      <!-- 🏳=荒野(無限)だけの「切り上げて持ち帰る」ボタン(v4.24.0) -->
      <button class="btn" id="svQuitBtn" style="padding:7px 10px" hidden>🏳</button>
      <div id="svHpWrap">🛡<div class="bHp svchp"><i id="svHpBar"></i></div><b id="svHpTxt"></b></div>
    </div>
    <div id="svField"></div>
    <!-- ゲージ右は「次のLvまであと◯問」(v4.23.0実機FB)。🪙はヘッダーのsvTitle行へ -->
    <div id="svMeta">
      <span id="svLv">Lv1</span>
      <div class="svxp"><i id="svXpBar"></i></div>
      <span id="svNeed"></span>
    </div>
  </div>
  <div id="svCutin" class="hidden"></div>
  <div class="svcol" id="svColR">
    <div id="svPrompt">
      <span id="svBadge"></span>
      <span id="svCount"></span>
      <div id="svWord"></div>
      <div id="svStats"></div>
    </div>
    <div class="choices" id="svChoices"></div>
    <!-- 次へは常設枠(visibilityで出し入れ)=出題中と確認中で選択肢の位置が動かない -->
    <div class="row" id="svCtrl" style="margin-top:8px">
      <button class="btn primary" style="flex:1; visibility:hidden" id="svNextBtn">次へ ▶</button>
    </div>
  </div>
</main>

<!-- ============ ことだまスロット(ミニゲーム・冒険タブから入る v4.27.0) ============
     svViewと同じ「上=ゲーム/下=クイズ」構成・svcol=display:contentsでPCは2カラム。
     可逆設計: このブロック+js/slot.js+CSSブロック+TABS1行+renderAdvの入口パネルで完結 -->
<main id="slotView" class="hidden">
  <div class="svcol" id="slColL">
    <div class="row" id="slHead" style="margin-top:4px; gap:8px; align-items:center">
      <button class="btn" id="slBack" style="padding:7px 12px">←</button>
      <div class="grow" style="font-weight:800; font-size:12px; line-height:1.3">🎰 ことだまスロット<br><span class="small" id="slSes"></span></div>
      <button class="btn" id="slMetaBtn" style="padding:7px 10px">📜</button>
      <div id="slBoost" class="slboostchip">◆0</div>
    </div>
    <div id="slMachine">
      <div id="slReels">
        <span class="sreel sspin">❔</span><span class="sreel sspin">❔</span><span class="sreel sspin">❔</span>
      </div>
      <div id="slMsg" class="small">リールは回り続ける ─ 正解のことだまを乗せろ</div>
    </div>
    <!-- 掛け金はスライダーで自由(🪙10〜2,000) -->
    <div class="row" id="slBetRow">
      <span class="small" style="flex:0 0 auto">掛け金</span>
      <input type="range" id="slBet" class="psim" style="margin-top:0" min="10" max="2000" step="10" value="100">
      <b id="slBetVal" style="flex:0 0 auto; color:var(--accent2); min-width:64px; text-align:right; font-size:13px">🪙100</b>
    </div>
  </div>
  <div class="svcol" id="slColR">
    <div id="slPrompt">
      <span id="slBadge"></span>
      <span id="slCount"></span>
      <div id="slWord"></div>
      <div id="slStats"></div>
    </div>
    <div class="choices" id="slChoices"></div>
    <div class="row" id="slCtrl" style="margin-top:8px">
      <button class="btn primary" style="flex:1; visibility:hidden" id="slNextBtn">次へ ▶</button>
    </div>
  </div>
</main>

<!-- ============ ガチャ ============ -->
<main id="gachaView" class="hidden">
  <div id="gachaBox"></div>
</main>

<!-- ============ 任務 ============ -->
<main id="missionView" class="hidden">
  <div class="seg" id="missionSeg">
    <button data-m="daily" class="active">デイリー<span class="segdot hidden" id="segDotD"></span></button>
    <button data-m="weekly">ウィークリー<span class="segdot hidden" id="segDotW"></span></button>
    <button data-m="ach">実績<span class="segdot hidden" id="segDotA"></span></button>
  </div>
  <div class="panel" id="missionList"></div>
</main>

<nav>
  <button id="navHome" class="active"><span class="nic badge">🏰<span class="dot hidden" id="navHomeDot"></span></span>ホーム</button>
  <button id="navQuiz"><span class="nic">📖</span>学習</button>
  <button id="navParty"><span class="nic">🛡️</span>編成</button>
  <button id="navAdv"><span class="nic">🗺️</span>冒険</button>
  <button id="navGacha"><span class="nic">🔮</span>ガチャ</button>
</nav>

<div id="overlay"><div id="modal"></div></div>
<div id="toast"></div>

<script src="js/words.js"></script>
<script src="js/phrases.js"></script>
<script src="js/roots.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/cards.js"></script>
<script src="js/chars.js"></script>
<script src="js/battle.js"></script>
<script src="js/pace.js"></script>
<script src="js/quiz.js"></script>
<script src="js/phrase.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/missions.js"></script>
<script src="js/dex.js"></script>
<script src="js/sv.js"></script>
<script src="js/slot.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
